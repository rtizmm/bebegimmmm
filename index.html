<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090506">
<title>bebegimmm ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600&amp;family=Noto+Sans+Devanagari:wght@600&amp;family=Noto+Sans+JP:wght@600&amp;family=Noto+Sans+KR:wght@600&amp;family=Noto+Sans+SC:wght@600&amp;family=Noto+Sans+Thai:wght@600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090506;color:#ffe4e8;font-family:Arial,sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,#23090d 0%,#100608 43%,#090506 75%)}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 12px;overflow:hidden}
h1{font-size:clamp(25px,4vw,36px);font-weight:500;letter-spacing:.07em;margin:0;text-align:center}
.stage{width:min(96vw,820px,calc(76svh * 800 / 740));margin:8px 0 12px;aspect-ratio:800/740;flex:none}
#heart{display:block;width:100%;height:100%;overflow:visible}
#beat{transform-box:view-box;transform-origin:400px 370px}
.running #beat{animation:heartbeat 2.8s 3.5s ease-in-out infinite}
.word{font-family:Arial,"Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Thai",sans-serif;font-weight:600;white-space:pre;opacity:0;user-select:none}
.running .word{animation:arrive .65s var(--delay) both cubic-bezier(.16,1,.3,1)}
.paused #beat,.paused .word{animation-play-state:paused!important}
@keyframes arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes heartbeat{0%,45%,100%{transform:scale(1)}12%{transform:scale(1.025)}23%{transform:scale(1)}31%{transform:scale(1.012)}}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{border:1px solid #6b2931;background:#210d12;color:#f9cbd0;padding:11px 19px;border-radius:999px;font:13px Arial,sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
button:hover{background:#39131c;border-color:#b34b58}button:focus-visible{outline:2px solid #ff8b92;outline-offset:4px}
.bead-link{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:12px 22px;border:1px solid #9c3545;border-radius:999px;background:linear-gradient(135deg,#511522,#290e16);color:#ffccd3;text-decoration:none;font-size:13px;transition:background .2s,transform .2s}.bead-link:hover{background:#661d2c;transform:translateY(-2px)}.bead-link:focus-visible{outline:2px solid #ff8b92;outline-offset:4px}
.note{font-size:12px;color:#c58b94;text-align:center;margin:18px 0 0}
@media(max-width:600px){main{padding:24px 10px}.stage{width:96vw;margin:20px 0 24px}button{padding:11px 16px}}
@media(prefers-reduced-motion:reduce){.running #beat,.running .word{animation:none}.word{opacity:1}button{transition:none}}
.destinations{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:15px}.destinations .bead-link{margin-top:0}.flower-link{border-color:#8c5925;background:linear-gradient(135deg,#482710,#25120b);color:#ffd798}.flower-link:hover{background:#593014}

.love-script{font-family:"Caveat","Segoe Print","Bradley Hand",cursive;font-size:clamp(23px,5.5vw,32px);font-weight:500;line-height:1.35;color:#ef9ba8;text-align:center;margin:12px 12px 4px;transform:rotate(-1.5deg);text-shadow:0 0 18px #ef9ba830;pointer-events:none}
</style>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&amp;display=swap" rel="stylesheet">
</head>
<body>
<main>
<!-- BAŞLIK: Buradaki yazıyı değiştirebilirsin. -->
<h1>bebegimmm ♡</h1>
<p class="love-script">nazlimm bebegimm askimmm</p>
<div class="stage" id="stage">
<svg id="heart" viewBox="0 0 800 740" role="img" aria-label="25 dilde seni seviyorum yazılarıyla dıştan içe dolan kırmızı kalp">
<g id="beat"><g id="words"></g></g>
</svg>
</div>
<div class="controls"><button id="replay" type="button">↻ Yeniden oynat</button><button id="toggle" type="button" aria-pressed="false">♡ Kalbi durdur</button></div>
<!-- ALT MESAJ: Buradaki yazıyı değiştirebilirsin. -->
<p class="note">snı cok sevıorrmm</p>
<div class="destinations"><a class="bead-link" href="./boncuk.html">✦ Boncuk kalp <span aria-hidden="true">→</span></a><a class="bead-link flower-link" href="./cicek.html">☀ Işık çiçeği <span aria-hidden="true">→</span></a><a class="bead-link" href="./sevgi.html">♡ Sevgi halkaları <span aria-hidden="true">→</span></a></div>
</main>
<script>
const phrases=["Seni seviyorum","I love you","Je t’aime","Te amo","Ti amo","Ich liebe dich","사랑해","愛してる","我爱你","Я тебя люблю","Eu te amo","Σ’ αγαπώ","Aku cinta kamu","Anh yêu em","Kocham cię","Ik hou van jou","Jag älskar dig","मैं तुमसे प्यार करता हूँ","ฉันรักเธอ","أحبك","Seni sevirəm","Te iubesc","Miluji tě","Szeretlek","Mahal kita"];
const ns="http://www.w3.org/2000/svg",holder=document.getElementById("words"),stage=document.getElementById("stage"),toggle=document.getElementById("toggle");
// Simetrik kalbin matematiksel dış hattı; merkez dahil bütün satırlar doldurulur.
const outline=Array.from({length:2000},(_,i)=>{const t=i*Math.PI/1000;return{x:400+336*Math.sin(t)**3,y:320-21*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}});
function spans(y){
 const cuts=[];
 for(let i=0;i<outline.length;i++){
  const a=outline[i],b=outline[(i+1)%outline.length];
  if((a.y<=y&&b.y>y)||(b.y<=y&&a.y>y))cuts.push(a.x+(y-a.y)*(b.x-a.x)/(b.y-a.y));
 }
 cuts.sort((a,b)=>a-b);const result=[];
 for(let i=0;i+1<cuts.length;i+=2)result.push([cuts[i],cuts[i+1]]);
 return result;
}
function makeWords(){
 holder.replaceChildren();
 // Ölçüm metni önce SVG'ye eklenir: bağlı olmayan metnin genişliği sıfır olabilir.
 const probe=document.createElementNS(ns,"text");probe.setAttribute("class","word");probe.setAttribute("font-size","15");holder.append(probe);
 const widths=phrases.map(s=>{probe.textContent=s;return probe.getComputedTextLength()});
 let serial=0;const items=[];
 for(let y=84;y<679;y+=18){
  // Harflerin hem üstü hem altı kalbin içinde kalır.
  const top=spans(y-12),bottom=spans(y+3);
  for(const a of top)for(const b of bottom){
   const left=Math.max(a[0],b[0])+2,right=Math.min(a[1],b[1])-2,room=right-left;
   if(room<13)continue;
   const row=[];let used=0;
   while(row.length<16){
    let chosen=-1;
    for(let k=0;k<phrases.length;k++){
     const index=(serial+k)%phrases.length;
     if(widths[index]+(row.length?9:0)<=room-used){chosen=index;break}
    }
    if(chosen<0)break;
    row.push(chosen);used+=widths[chosen]+(row.length>1?9:0);serial=(chosen+1)%phrases.length;
   }
   // En dar uçlarda da tam bir ifade: harfleri ezmeden yazı boyutunu küçült.
   if(!row.length){row.push(4);used=widths[4]}
   const scale=Math.min(1,room/used),fontSize=15*scale;
   const wordWidth=row.reduce((sum,index)=>sum+widths[index]*scale,0);
   const gap=row.length>1?(room-wordWidth)/(row.length-1):0;
   let x=row.length===1?(left+right-wordWidth)/2:left;
   for(const index of row){
    const el=document.createElementNS(ns,"text"),w=widths[index]*scale;
    el.setAttribute("class","word");el.setAttribute("x",x);el.setAttribute("y",y);el.setAttribute("font-size",fontSize);
    el.setAttribute("direction",index===19?"rtl":"ltr");el.setAttribute("text-anchor",index===19?"end":"start");
    el.textContent=phrases[index];
    // RENKLER: Kırmızı tonlarını buradan değiştirebilirsin.
    el.setAttribute("fill",["#ff514e","#f34043","#ff665b","#e83b43","#ff7869"][items.length%5]);
    const cx=x+w/2,cy=y-6;
    const distance=Math.min(...outline.filter((_,i)=>i%8===0).map(p=>Math.hypot(p.x-cx,p.y-cy)));
    items.push({el,distance,y});holder.append(el);x+=w+gap;
   }
  }
 }
 probe.remove();
 // Önce dış hat belirir, sonra yazılar merkeze doğru boşlukları doldurur.
 items.sort((a,b)=>a.distance-b.distance||a.y-b.y);
 items.forEach((item,i)=>item.el.style.setProperty("--delay",(0.08+i/items.length*2.9).toFixed(3)+"s"));
}
function replay(){stage.classList.remove("running","paused");void stage.offsetWidth;stage.classList.add("running");toggle.textContent="♡ Kalbi durdur";toggle.setAttribute("aria-pressed","false")}
document.getElementById("replay").addEventListener("click",replay);
toggle.addEventListener("click",()=>{const paused=stage.classList.toggle("paused");toggle.textContent=paused?"♡ Kalbi oynat":"♡ Kalbi durdur";toggle.setAttribute("aria-pressed",String(paused))});
makeWords();replay();
// Kullanılan alfabelerin yazı tipleri hazır olduğunda ölçümleri yenile.
document.fonts.ready.then(()=>{makeWords();replay()});
</script>
</body>
</html>
